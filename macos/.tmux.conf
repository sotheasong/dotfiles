# ~/.tmux.conf — sane starter config

# ── Prefix ────────────────────────────────────────────────
# Use Ctrl-a instead of Ctrl-b (classic, works in every terminal).
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # press Ctrl-a twice to send a literal Ctrl-a

# ── General ───────────────────────────────────────────────
set -g mouse on               # click panes/windows, drag borders, scroll
set -g history-limit 50000    # bigger scrollback buffer
set -sg escape-time 10        # snappier; avoids vim ESC lag
set -g base-index 1           # windows start at 1, not 0
setw -g pane-base-index 1     # panes start at 1 too
set -g renumber-windows on    # keep window numbers gapless when one closes
set -g set-clipboard on       # yank to the system clipboard

# Use the terminal's true colors (nice with modern terminals)
set -g default-terminal "tmux-256color"

# kitty sends keys via its extended keyboard protocol; let tmux understand it
set -s extended-keys on
set -as terminal-features 'xterm-kitty:extkeys'

# ── Reload config ─────────────────────────────────────────
# prefix r  → reload this file without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ── Splits ────────────────────────────────────────────────
# More intuitive: | splits vertically, - splits horizontally.
# Both open the new pane in the current directory.
bind ] split-window -h -c "#{pane_current_path}"
bind [ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# New windows also inherit the current directory
bind t new-window -c "#{pane_current_path}"

# ── Pane navigation (vim-style hjkl) ──────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + Shift-arrow (repeatable: hold and tap)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vim keys) ──────────────────────────────────
# prefix [  → enter copy/scroll mode, then use hjkl to move.
# v to start selection, y to yank, q to quit.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Status bar (simple, readable) ─────────────────────────
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[bold] #S "        # session name on the left
set -g status-left-length 30
set -g status-right " %a %d %b  %H:%M "  # date + time on the right
setw -g window-status-current-style "bg=colour39,fg=colour232,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
